  /v1/chat:
    post:
      tags:
      - Chat
      summary: Ask an agent
      description: |
        Send one message and get the agent's answer, with the passages it was based on.

        Name the agent in `agent` (its slug, or `slug@v2` to pin a version; the default is the Live version).
        On a container or `tawi serve`, which serve one agent or model, `agent` can be left out.

        Set `user` to any stable id of the person asking (a customer number, a session id) and the agent keeps
        the last 6 turns of that person's conversation, so follow-ups like "and on Saturday?" work. Without
        `user` every message stands alone, and identical questions can be answered from a cache
        (`"cached": true`).

        Set `stream: true` to get the answer as server-sent events while it is written. Streaming is served by
        the studio, and by `tawi serve` when it has no search index; the container and `tawi serve` with an index
        return the whole answer as JSON instead.

        While the studio is training (one GPU, one job), answers that need the model reply
        `{"message": "We'll be back shortly.", "busy": true}` with status 200; `mode: rag` still answers.
      operationId: chat
      x-tawi-servers:
      - studio
      - agent
      - library
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
            examples:
              simple:
                summary: One question
                value:
                  agent: maple-grove-dental
                  message: Do you take new patients?
              conversation:
                summary: Part of a conversation, pinned to version 2
                value:
                  agent: maple-grove-dental@v2
                  message: And on Saturday?
                  user: customer-123
              streamed:
                summary: Streamed answer
                value:
                  agent: maple-grove-dental
                  message: What are your hours?
                  stream: true
        required: true
      responses:
        '200':
          description: 'The answer, or (with `stream: true`) a stream of answer events.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
              examples:
                answer:
                  value:
                    message: Yes, we're taking new patients. You can book on our website or call 555-0142.
                    sources:
                    - source: new-patients.pdf
                      page: 1
                      score: 0.812
                      excerpt: New patients are welcome. Book online or call 555-0142...
                    bot: maple-grove-dental@v2
                    mode: auto
                    timing:
                      search_ms: 11.4
                      rerank_ms: 4.1
                      first_token_ms: 182.0
                      generate_ms: 640.2
                busy:
                  summary: While the studio is training
                  value:
                    message: We'll be back shortly.
                    sources: []
                    busy: true
            text/event-stream:
              schema:
                type: string
                description: 'Server-sent events. Each `data:` line is a ChatStreamEvent (JSON); the last line is `data: [DONE]`.'
                contentMediaType: application/json
                contentSchema:
                  $ref: '#/components/schemas/ChatStreamEvent'
              example: |
                data: {"delta": "Yes, "}

                data: {"delta": "we're taking new patients."}

                data: {"done": true, "message": "Yes, we're taking new patients.", "sources": [], "checks": [], "bot": "maple-grove-dental@v2", "mode": "auto", "first_token_ms": 182, "total_ms": 640, "timing": {}}

                data: [DONE]
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /v1/chat/completions:
    post:
      tags:
      - OpenAI-compatible
      summary: Chat completions (OpenAI format)
      description: |
        OpenAI's chat completions format, so OpenAI client libraries work unchanged: set the base URL to
        `http://<host>:<port>/v1` and the API key to the agent's key, and put the agent's slug in `model`.

        The agent answers the **last user message**. On the studio and in a container, earlier messages in
        `messages` are not sent to the model: pass `user` to keep a conversation, as with `POST /v1/chat`.
        `tawi serve` does pass the earlier turns in `messages` to the model as history.

        Sampling settings (`temperature`, `max_tokens` and the like) are accepted and ignored: the agent's own
        settings apply. `stream: true` returns `chat.completion.chunk` events on the studio and `tawi serve`;
        a container returns the whole completion.
      operationId: chatCompletions
      x-tawi-servers:
      - studio
      - agent
      - library
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
            example:
              model: maple-grove-dental
              messages:
              - role: user
                content: What are your hours on Monday?
        required: true
      responses:
        '200':
          description: 'A chat completion, or (with `stream: true`) a stream of chunks.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletion'
              example:
                id: chatcmpl-3f9c2a71b0d4
                object: chat.completion
                created: 1792460517
                model: maple-grove-dental@v2
                choices:
                - index: 0
                  message:
                    role: assistant
                    content: On Monday we're open 8 am to 5 pm.
                  finish_reason: stop
            text/event-stream:
              schema:
                type: string
                description: 'Server-sent events. Each `data:` line is a ChatCompletionChunk (JSON); the last line is `data:
                  [DONE]`.'
                contentMediaType: application/json
                contentSchema:
                  $ref: '#/components/schemas/ChatCompletionChunk'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /v1/health:
    get:
      tags:
      - Health
      summary: Health check
      description: |
        No key needed. Use it for load-balancer and container health checks. The fields depend on the server:
        the studio reports training and the models on the GPU, a container reports whether its agent is
        `ready` (the model is loaded) and any start-up `error`, and `tawi serve` names its model.
      operationId: health
      security: []
      x-tawi-servers:
      - studio
      - agent
      - library
      responses:
        '200':
          description: The server is up.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/StudioHealth'
                - $ref: '#/components/schemas/AgentHealth'
                - $ref: '#/components/schemas/LibraryHealth'
              examples:
                studio:
                  value:
                    ok: true
                    training: false
                    loading: null
                    preparing: null
                    models_loaded:
                    - v2 [16bit, llamacpp]
                    gpu:
                      name: NVIDIA GeForce RTX 4060 Laptop GPU
                      total_gb: 8.0
                      used_gb: 3.1
                      temp_c: 52
                      util_pct: 4
                agent:
                  value:
                    ok: true
                    ready: true
                    error: null
                    agent: maple-grove-dental
                    version: 2
                    precision: 16bit
                    loading: null
                    uptime_s: 3605
                library:
                  value:
                    ok: true
                    model: qwen3-0.6b
                    rag: true
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: 'The agent''s API key (`ak_...`): `Authorization: Bearer ak_...`.'
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: The agent's API key in the X-API-Key header.
    apiKeyQuery:
      type: apiKey
      in: query
      name: key
      description: The API key in the URL. Accepted by the studio and containers so `/query` works from a browser; avoid it
        elsewhere.
  schemas:
    AgentHealth:
      type: object
      title: AgentHealth
      required:
      - ok
      - ready
      properties:
        ok:
          type: boolean
          description: False when start-up failed (see `error`).
        ready:
          type: boolean
          description: The model is loaded and answers are quick.
        error:
          type:
          - string
          - 'null'
        agent:
          type: string
        version:
          type:
          - integer
          - 'null'
        precision:
          type: string
        loading:
          type:
          - string
          - 'null'
        uptime_s:
          type: integer
    ChatCompletion:
      type: object
      required:
      - id
      - object
      - created
      - model
      - choices
      properties:
        id:
          type: string
          example: chatcmpl-3f9c2a71b0d4
        object:
          type: string
          const: chat.completion
        created:
          type: integer
          description: Unix time.
        model:
          type: string
          description: The agent and version that answered.
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                type: object
                properties:
                  role:
                    type: string
                    const: assistant
                  content:
                    type: string
              finish_reason:
                type: string
                enum:
                - stop
    ChatCompletionChunk:
      type: object
      description: |
        One `data:` line of a streamed completion, as OpenAI sends them; the stream ends with `data: [DONE]`. The
        studio's last chunk also carries `final_message`, the whole answer after the safety checks.
      properties:
        id:
          type: string
        object:
          type: string
          const: chat.completion.chunk
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              delta:
                type: object
                properties:
                  role:
                    type: string
                  content:
                    type: string
              finish_reason:
                type:
                - string
                - 'null'
        final_message:
          type: string
    ChatCompletionRequest:
      type: object
      required:
      - messages
      properties:
        model:
          type: string
          description: The agent's slug (or `slug@v2`). Optional on the per-agent URL and on a container.
          example: maple-grove-dental
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
          description: The conversation. The last user message is the question.
        user:
          type: string
          description: Keeps a conversation per user, as in `POST /v1/chat` (studio and container).
        stream:
          type: boolean
          default: false
      additionalProperties: true
    ChatMessage:
      type: object
      required:
      - role
      - content
      properties:
        role:
          type: string
          enum:
          - system
          - user
          - assistant
        content:
          description: Text, or OpenAI content parts (only the text parts are read).
          oneOf:
          - type: string
          - type: array
            items:
              type: object
              properties:
                type:
                  type: string
                text:
                  type: string
    ChatRequest:
      type: object
      title: ChatRequest
      required:
      - message
      properties:
        agent:
          type:
          - string
          - 'null'
          description: The agent's slug, or `slug@v2` to pin a version (default the Live version). Optional on a container.
          example: maple-grove-dental
        bot:
          type:
          - string
          - 'null'
          description: Older name for `agent`.
          deprecated: true
        message:
          type: string
          description: The question. Up to 4,000 characters.
          maxLength: 4000
          example: Do you take new patients?
        user:
          type:
          - string
          - 'null'
          description: |
            A stable id of the person asking. The agent keeps the last 6 turns per user (it is stored hashed), so
            follow-up questions work. Leave it out for one-off questions.
          example: customer-123
        mode:
          type: string
          enum:
          - auto
          - rag
          - model
          - rag+model
          default: auto
          description: |
            `auto` uses the agent's own setting. `rag` answers from the documents only (no model, so it works while
            the GPU is busy training), `model` uses the model alone, `rag+model` gives the model the best passages.
        stream:
          type: boolean
          default: false
          description: Return server-sent events while the answer is written (studio, and `tawi serve` without an index).
    ChatResponse:
      type: object
      required:
      - message
      - sources
      properties:
        message:
          type: string
          description: The answer.
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
          description: The passages used, best first. Empty when the agent doesn't search documents.
        bot:
          type: string
          description: 'Studio: the agent and version that answered, as `slug@v2`.'
          example: maple-grove-dental@v2
        agent:
          type: string
          description: 'Container: the agent and version that answered, as `slug@v2`.'
        model:
          type: string
          description: '`tawi serve`: the model''s name.'
        mode:
          type: string
          description: The mode that was asked for.
        timing:
          $ref: '#/components/schemas/Timing'
        cached:
          type: boolean
          description: The same question was answered recently and this is that answer (no model call).
        busy:
          type: boolean
          description: 'The studio is training: the message is a placeholder, ask again later.'
      additionalProperties: true
    ChatStreamEvent:
      description: |
        One `data:` line of the event stream. Pieces of the answer arrive as `{"delta": ...}`; the last event is
        `{"done": true, ...}` with the whole answer and its sources, or `{"error": ..., "status": ...}` if the answer
        failed part-way. The stream ends with the line `data: [DONE]`.
      oneOf:
      - type: object
        title: Delta
        required:
        - delta
        properties:
          delta:
            type: string
            description: The next piece of the answer.
      - type: object
        title: Done
        required:
        - done
        - message
        properties:
          done:
            type: boolean
            const: true
          message:
            type: string
          sources:
            type: array
            items:
              $ref: '#/components/schemas/Source'
          checks:
            type: array
            items:
              type: string
            description: The safety and grounding checks that changed or confirmed the answer.
          bot:
            type: string
          mode:
            type: string
          busy:
            type: boolean
          first_token_ms:
            type: integer
          total_ms:
            type: integer
          timing:
            $ref: '#/components/schemas/Timing'
      - type: object
        title: StreamError
        required:
        - error
        - status
        properties:
          error:
            type: string
          status:
            type: integer
            description: The HTTP status the error would have had (400, 500 or 503).
    Error:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          description: What went wrong, in a sentence.
        request_id:
          type: string
          description: The request's id, as in the X-Request-ID header.
    Gpu:
      type: object
      description: 'The studio''s GPU, or `{"error": "No NVIDIA GPU found"}`.'
      properties:
        name:
          type: string
        total_gb:
          type: number
        used_gb:
          type: number
        temp_c:
          type:
          - number
          - 'null'
        util_pct:
          type:
          - number
          - 'null'
        unified_memory:
          type: boolean
          description: Apple Silicon, where the GPU shares the Mac's memory.
        error:
          type: string
      additionalProperties: true
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LibraryHealth:
      type: object
      title: LibraryHealth
      required:
      - ok
      - model
      - rag
      properties:
        ok:
          type: boolean
        model:
          type: string
        rag:
          type: boolean
          description: The server answers from a search index.
    Source:
      type: object
      description: A passage the answer was based on.
      required:
      - source
      - score
      properties:
        source:
          type: string
          description: The document (or example Q&A file) the passage came from.
          example: new-patients.pdf
        page:
          type:
          - integer
          - 'null'
          description: The page, for PDFs.
        score:
          type: number
          description: How well the passage matched the question (0 to 1, after reranking).
          example: 0.812
        excerpt:
          type: string
          description: The start of the passage (up to 240 characters).
      additionalProperties: true
    StudioHealth:
      type: object
      title: StudioHealth
      required:
      - ok
      - training
      properties:
        ok:
          type: boolean
        training:
          type: boolean
          description: 'A training run is using the GPU: model answers reply busy.'
        loading:
          type:
          - string
          - 'null'
          description: The model being loaded right now, if any.
        preparing:
          type:
          - string
          - 'null'
        models_loaded:
          type: array
          items:
            type: string
          description: Models held for answering, as `name [precision, engine]`.
        gpu:
          $ref: '#/components/schemas/Gpu'
    Timing:
      type: object
      description: Where the time went, in milliseconds. Fields appear when that step ran.
      properties:
        search_ms:
          type: number
        rerank_ms:
          type: number
        first_token_ms:
          type: number
        generate_ms:
          type: number
      additionalProperties: true
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  responses:
    Error400:
      description: |
        The request can't be answered as sent: `message` is empty or longer than 4,000 characters, `mode` is
        unknown, the version isn't written as `agent@v2`, or the question and context don't fit the model.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: message is longer than 4000 characters
            request_id: 7f3a9c2e1b4d
    Error401:
      description: The API key is missing, or isn't the key of this agent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: Invalid API key for this agent
            request_id: 7f3a9c2e1b4d
    Error403:
      description: The pinned version (`agent@v3`) hasn't passed the safety check, so the API won't serve it. Studio only.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: v3 hasn't passed the safety check, so the API won't serve it
            request_id: 7f3a9c2e1b4d
    Error404:
      description: No such version (`agent@v9`), or a container was asked for an agent or version it doesn't serve.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: No version v9
            request_id: 7f3a9c2e1b4d
    Error429:
      description: |
        Too many requests. The studio allows 30 requests a minute per key by default (`TAWI_RATE_PER_MIN`, or the
        agent's own limit set in the studio), an optional daily limit per agent, and locks out an address after 30
        wrong keys in 5 minutes. The studio sends `Retry-After`; a container (30 a minute) doesn't.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: 'Rate limit: 30 requests a minute for this key'
            request_id: 7f3a9c2e1b4d
    Error500:
      description: Something went wrong on the server. `request_id` matches the `X-Request-ID` header and a line in the logs.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: Something went wrong on the server (ref 7f3a9c2e1b4d). Details are in the Logs page.
            request_id: 7f3a9c2e1b4d
    Error503:
      description: The model couldn't answer (it failed to load or ran out of memory). Try again; the reason is in `detail`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  headers:
    X-Request-ID:
      description: |
        A short id for this request, also written on its log line. Send your own `X-Request-ID` to have it used
        instead. Error bodies repeat it as `request_id`.
      schema:
        type: string
    Retry-After:
      description: Seconds to wait before trying again.
      schema:
        type: integer
security:
- bearer: []
- apiKeyHeader: []
externalDocs:
  description: Agent API guide
  url: https://docs.tawi.ai/guides/agent-api
