info:
  title: Tawi Agent API
  version: 1.0.0
  summary: Ask a Tawi agent questions from your own app.
  description: |
    The API your apps, websites and scripts call to get answers from an agent you built in the Tawi studio.

    Three servers speak it, with small differences noted on each operation (`x-tawi-servers`):

    - **studio**: the studio itself serves every live agent on one port (default `http://127.0.0.1:8000`).
    - **agent**: an agent's Docker container (`tawi.deploy.serve`) serves one agent (default port 8100).
    - **library**: `tawi serve` / `tawi.serve()` serves one model, optionally answering from a search index.

    Every request except `GET /v1/health` needs the agent's API key (`ak_...`), which the studio shows once on the
    Go live step. Send it as `Authorization: Bearer <key>` or `X-API-Key: <key>`.

    Guides: [quickstart](https://docs.tawi.ai/guides/quickstart), [Agent API guide](https://docs.tawi.ai/guides/agent-api),
    [authentication](https://docs.tawi.ai/guides/authentication), [versioning](https://docs.tawi.ai/guides/versioning).
  contact:
    name: Tawi.ai
    url: https://tawi.ai
servers:
- url: http://127.0.0.1:8000
  description: The studio on this PC (all live agents)
- url: http://127.0.0.1:8100
  description: An agent's Docker container, or tawi serve (one agent or model)
- url: '{base}'
  description: Your own host, usually behind an HTTPS reverse proxy
  variables:
    base:
      default: https://agent.example.com
tags:
- name: Chat
  description: Ask a question and get the agent's answer, whole or streamed.
- name: OpenAI-compatible
  description: The same answers in OpenAI's chat completions format, for OpenAI client libraries.
- name: Health
  description: Is the server up and is the model loaded.
- name: Testing
  description: Quick checks from a browser. Not for apps.
