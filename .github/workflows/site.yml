# Build the site on every pull request; build and deploy to GitHub Pages on main.
#
# A Tawi release triggers this with a repository_dispatch (event type "tawi-release", payload {"version": "X.Y.Z"}),
# sent by the release workflow in the Tawi repo. The job then downloads that release's docs archive, freezes it as a
# docs version, commits the result to main, and deploys. Run it by hand (Actions > Site > Run workflow) with a
# version to do the same for a release that was missed.
#
# Settings it needs (repository > Settings > Secrets and variables > Actions):
#   variable TAWI_REPO              the Tawi repository, for example acme/tawi
#   secret   TAWI_REPO_TOKEN        a fine-grained token with read access to that repository's contents (releases);
#                                   not needed if the Tawi repository is public
#   secret   CF_WEB_ANALYTICS_TOKEN optional: Cloudflare Web Analytics site token (no cookies)
name: Site

on:
  push:
    branches: [main]
  pull_request:
  repository_dispatch:
    types: [tawi-release]
  workflow_dispatch:
    inputs:
      version:
        description: "Tawi version whose docs to publish (X.Y.Z); empty to just rebuild"
        required: false

permissions:
  contents: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ github.event.client_payload.version || inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Publish the docs of a Tawi release
        if: env.VERSION != ''
        env:
          GH_TOKEN: ${{ secrets.TAWI_REPO_TOKEN || github.token }}
          TAWI_REPO: ${{ vars.TAWI_REPO }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version: $VERSION"; exit 1; }
          gh release download "v$VERSION" --repo "$TAWI_REPO" --pattern "tawi-docs-$VERSION.tar.gz" --dir "$RUNNER_TEMP"
          node scripts/sync-docs.mjs "$RUNNER_TEMP/tawi-docs-$VERSION.tar.gz"
          node scripts/release-docs.mjs "$VERSION"

      - run: npm run build
        env:
          CF_WEB_ANALYTICS_TOKEN: ${{ github.event_name != 'pull_request' && secrets.CF_WEB_ANALYTICS_TOKEN || '' }}
      - run: npm run typecheck

      - name: Commit the new docs version
        if: env.VERSION != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs static/openapi src/pages/changelog.md tawi-version.txt versions.json versioned_docs versioned_sidebars
          git diff --cached --quiet || git commit -m "Docs for Tawi $VERSION"
          git push origin HEAD:main

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || env.VERSION != '')
        with:
          path: build

  deploy:
    # GitHub Pages. One-time setup: Settings > Pages > Source: "GitHub Actions", then set the custom domain there.
    needs: site
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event.client_payload.version || inputs.version)
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
